# r7: bump the default outgoing IP TTL from the Linux default (64) to 65.
#
# WHY: when this device consumes another phone's Personal Hotspot/tethering
# (iPhone via USB ipheth or Bluetooth PAN - see GUNLUK G1.31/G1.32), the
# tethering phone forwards our packets onward and decrements TTL by one hop
# in the process. A carrier can fingerprint that decrement (packets arriving
# at their network with TTL one lower than what a native app on the phone
# itself would produce) as a signal that the connection is being shared to
# another device, and may throttle or bill it differently. Shipping our own
# packets with TTL 65 means they still read as 64 - the phone's own native
# value - by the time they reach the carrier, indistinguishable from
# traffic the tethering phone generated itself.
#
# Deliberately global (not scoped to a specific tethering interface): this
# device has no stable/predictable interface name for it (ipheth creates a
# MAC-derived enx<mac> name per iPhone, bnep0 for BT PAN), and TTL 65 vs 64
# has no functional downside on any other path (Wi-Fi, mobile data), so a
# system-wide default is the non-fragile choice over interface-matching
# iptables/nftables rules.
net.ipv4.ip_default_ttl=65
