[Manager]
# r7-server: this device runs unattended most of the time - a genuine
# hang (not just a crashed service, which each unit's own Restart=
# already covers) would otherwise sit dead until someone physically
# notices. This device has a real hardware watchdog (/dev/watchdog0,
# /dev/watchdog1 - Samsung's s3c2410-wdt driver, confirmed live) that
# systemd already knows how to drive: PID 1 pets it periodically, and if
# the whole system hangs badly enough that PID 1 itself stops running,
# the hardware forces a reset after this timeout. Covers kernel panics
# too, not just silent hangs. 60s, not the 30s used to confirm this
# live: long enough to not false-trigger during legitimate heavy I/O
# stalls, short enough to actually matter for an unattended device.
RuntimeWatchdogSec=60
