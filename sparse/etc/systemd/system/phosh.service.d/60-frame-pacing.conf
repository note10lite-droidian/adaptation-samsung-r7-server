[Service]
# The hwcomposer backend starts drawing a frame WLR_HWC_IDLE_TIME milliseconds
# before vsync (backend/hwcomposer/output.c). The default is 2 ms; at 60 Hz the
# frame interval is 16.67 ms and the Mali-G72 does not finish compositing
# 1080x2400 in 2 ms, so frames miss vsync and the UI stutters. Give it more
# head start.
#
# This is a mitigation, not a fix. The real gap is that the wlroots hwcomposer
# backend never delivers presentation feedback to clients (there is a FIXME in
# the code), so clients cannot pace themselves to vsync at all.
Environment=WLR_HWC_IDLE_TIME=12
