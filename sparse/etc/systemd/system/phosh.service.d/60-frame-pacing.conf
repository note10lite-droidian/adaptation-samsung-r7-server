[Service]
# hwcomposer backend i kareyi vsync ten WLR_HWC_IDLE_TIME milisaniye once
# cizmeye baslar (backend/hwcomposer/output.c). Varsayilan 2 ms; 60 Hz de
# kareler arasi 16.67 ms ve Mali-G72 nin 1080x2400 kompozisyonu 2 ms de
# bitmiyor -> kare vsync i kaciriyor -> takilma. Daha cok on sure ver.
Environment=WLR_HWC_IDLE_TIME=12
