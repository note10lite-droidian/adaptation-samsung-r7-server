[Unit]
# Stock phosh.service: OnFailure=getty@tty1.service, Conflicts=getty@tty1.service.
#
# WHY: on a heavily-loaded first boot (audio/WiFi/modem/sensor errors firing
# concurrently), phoc's libseat session-activation wait (hardcoded ~10s in
# phoc itself, not configurable here) can time out before logind marks the
# session active, so phoc fails to create a backend and exits. That alone is
# recoverable - phosh.service has Restart=always/RestartSec=5s - but the
# stock OnFailure= starts getty@tty1.service as a fallback console, and the
# stock Conflicts= then permanently blocks phosh.service's own restarts for
# the rest of that boot (systemd won't queue a start job for a unit that
# conflicts with one already running, and nothing ever stops the getty).
# Traced live 2026-08-08 via a persistent-journal capture of a fresh-flash
# boot: zero phosh restart attempts in the 107s between the stop and the
# journal ending, though RestartSec=5s should have produced ~20. Screen
# stays black and fully unresponsive (no compositor ever running to receive
# input) until a full device reboot gives phosh an unconflicted attempt.
#
# Keep OnFailure= (still useful as a debug console if phosh is genuinely,
# persistently broken, not just caught in a transient first-boot race) but
# drop Conflicts= so Restart=always can actually do its job in parallel.
Conflicts=
