[Service]
# r7-server: upstream ships this as Type=oneshot, but /usr/sbin/mtp-configfs's
# last command for the rndis mode is `dhcpd -f ...` (foreground, no & and no
# exec) - the script's own process therefore never exits, so a oneshot start
# job sits in "activating" forever, every single boot, blocking anything
# ordered against it (observed live 2026-08-12: it held up graphical.target's
# own start job for the entire boot). Type=simple is the semantically correct
# type here: the unit's main process (the mtp-configfs script, still running
# as dhcpd's parent) is meant to stay alive indefinitely, and simple only
# needs it to have started, not exited, to consider the unit active. Not
# patching the script itself - it belongs to another package (mtp-server),
# not this one.
Type=simple
