# systemd-resolved is MASKED on this system (see the systemd-resolved.service
# symlink to /dev/null in this package), but NetworkManager still pointed
# resolv.conf at the resolved stub (127.0.0.53). With nothing listening there,
# DNS resolution failed completely.
#
# dns=default          -> NetworkManager uses the nameservers it gets from the
#                         connection directly, with no plugin in between.
# rc-manager=symlink   -> NetworkManager writes /run/NetworkManager/resolv.conf
#                         and points /etc/resolv.conf at it.
#
# Do NOT use rc-manager=unmanaged here. That stops NetworkManager touching
# resolv.conf at all, which means the image has to ship a static one - and a
# static nameserver baked into a generic image breaks DNS for everyone whose
# network does not happen to match it.
[main]
dns=default
rc-manager=symlink
