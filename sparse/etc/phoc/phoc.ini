# r7-server: phoc's own config. MUST ship here, not be borrowed from
# elsewhere: phoc-console.service used to pass -C /usr/share/phosh/phoc.ini,
# which is shipped by the *phosh* package - and phosh is no longer installed
# at all since this fork moved to the gsi_base edition. phoc was therefore
# being started with a config path that does not exist, silently falling back
# to built-in defaults (confirmed live 2026-08-12: no phoc.ini existed
# anywhere on a freshly flashed device).
#
# scale: phoc's default is "auto", which derives the scale from the panel's
# physical size. On this device that produced an unusably small console -
# the wlroots hwcomposer backend does not give auto anything useful to work
# with. 2.5 was picked by testing live on the device and confirmed readable
# by the owner. The output name HWCOMPOSER-1 was verified with wlopm, not
# assumed.
[core]
xwayland = false

[output:HWCOMPOSER-1]
scale = 2.5
