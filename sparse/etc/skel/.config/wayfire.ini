# r7 (SM-N770F) wayfire desktop-shell config.
# PROVEN plugin set (NO 'decoration' -> null-derefs the 0.18-backport wlroots
# xdg lifecycle, crashes on toplevel map). 'plamo' REQUIRED so tap/click
# reaches layer-shell surfaces (waybar/fuzzel).
[core]
plugins = alpha animate command expo grid move resize switcher vswitch window-rules wm-actions foreign-toplevel gtk-shell wayfire-shell fast-switcher scale plamo autostart
xwayland = true

# HiDPI + landscape. Panel 1080x2400 @ ~403 DPI. scale 1.75 -> ~1371x617
# logical; transform 270 = clockwise landscape.
# NOTE: this wlroots/hwcomposer does NOT apply the output transform to touch,
# so touch rotation is handled by a libinput calibration matrix in
# /etc/udev/rules.d/99-r7-touch-calibration.rules (NOT by [output]-mapping).
[output:HWCOMPOSER-1]
scale = 1.750000
transform = 270

[autostart]
panel = waybar
term = sh -c 'sleep 5 && foot'

[command]
binding_launcher = <super> KEY_D
command_launcher = fuzzel
binding_terminal = <super> KEY_ENTER
command_terminal = foot
