# r7 (SM-N770F) wayfire desktop-shell config.
# PROVEN plugin set (NO 'decoration' -> null-derefs the 0.18-backport wlroots
# xdg lifecycle, crashes on toplevel map). 'plamo' REQUIRED so tap/click
# reaches layer-shell surfaces (waybar/fuzzel).
[core]
plugins = alpha animate command expo grid move resize switcher vswitch window-rules wm-actions foreign-toplevel gtk-shell wayfire-shell fast-switcher scale plamo autostart
xwayland = true

# HiDPI + landscape default (r7-auto-rotate.service overrides live via
# wlr-randr once the wayfire session is up; this is just the boot-time
# fallback before the first orientation read). Panel 1080x2400 @ ~403 DPI.
# scale 1.75 -> ~1371x617 logical @ transform 270.
# NOTE: no touch calibration matrix is needed or wanted here -- wlroots
# already applies the output transform to absolute input devices internally.
# A libinput calibration matrix layered on top double-rotates touch input
# (proven 2026-08-04: identical setup with a matrix had touch landing
# mirrored/inverted; removing the matrix fixed it immediately). See
# r7-wayfire-hwcomposer-viable memory.
[output:HWCOMPOSER-1]
scale = 1.750000
transform = 270

[autostart]
panel = waybar
term = sh -c 'sleep 5 && foot'

[command]
binding_launcher = <super> KEY_D
command_launcher = fuzzel
binding_terminal = <super> KEY_ENTER
command_terminal = foot
