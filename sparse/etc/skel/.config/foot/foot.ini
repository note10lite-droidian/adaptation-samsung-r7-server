[main]
# Left/right padding clears the panel's curved corners; also gives a
# little top/bottom breathing room.
pad=12x4
# Smaller than foot's default (size=8) for more visible text on a small
# panel. NOTE: a size=6 test made phosh-osk-stub's terminal shortcuts row
# (arrows/PgUp/PgDn) stop getting drawn on a session restart - not
# reproduced conclusively as causal (could have been restart-timing
# instead), but size=7 was confirmed live to keep the row working, so
# staying there rather than re-risking it.
font=monospace:size=7

[colors]
# Pure black, not foot's default 242424 - this is an AMOLED panel, and a
# dark-gray-not-black background still lights every sub-pixel dimly across
# the whole screen instead of leaving it truly off.
background=000000
